[project]
name = "dexcom-paper-display"
version = "0.1.0"
description = "CGM Display Driver for Raspberry Pi e-Paper"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "spidev>=3.8; sys_platform == 'linux'",
    "pydexcom>=0.5.1",
    "python-dotenv>=1.0.0",
    "pillow>=10.0.0",
    "rpi-gpio",
    "waveshare-epaper",
]

[project.scripts]
dexcom-paper-display = "dexcom_paper_display:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
waveshare_epd = { path = "vendor/waveshare_epd", editable = true }
